<title>制造・销售目录（全14页）｜Park Homes Okinawa</title>
<meta name="description" content="汇整冲绳规格钢结构拖车房屋全机种的全14页数字目录。亦支持打印・PDF保存。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d2d5e;--blue:#1560a8;--coral:#e8614a;--coral-dark:#c44a35;--gray:#33373b;--white:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Noto Sans JP',sans-serif;background:var(--gray);color:#fff}

/* TOOLBAR */
.toolbar{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:2px solid var(--blue);box-shadow:0 2px 12px rgba(0,0,0,.12)}
.toolbar-inner{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s;white-space:nowrap}
.btn-back{background:#eef3fa;color:#1a2332}
.btn-back:hover{background:#dde7f5}
.btn-print{background:var(--coral);color:#fff;box-shadow:0 2px 8px rgba(232,97,74,.3)}
.btn-print:hover{background:var(--coral-dark)}

/* PAGES */
.viewer{max-width:920px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:20px}
.pg{width:100%;height:auto;display:block;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.28);border-radius:4px}

/* PRINT */
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  .toolbar{display:none!important}
  .viewer{max-width:none;margin:0;padding:0;gap:0}
  .pg{width:210mm;height:297mm;box-shadow:none;border-radius:0;page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
}
</style>
