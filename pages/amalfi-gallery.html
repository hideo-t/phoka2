.lb-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;

<script>
(function(){
  var imgs=["../images/gallery/amalfi/amalfi-01.jpg","../images/gallery/amalfi/amalfi-02.jpg","../images/gallery/amalfi/amalfi-03.jpg","../images/gallery/amalfi/amalfi-04.jpg","../images/gallery/amalfi/amalfi-05.jpg","../images/gallery/amalfi/amalfi-06.jpg","../images/gallery/amalfi/amalfi-07.jpg","../images/gallery/amalfi/amalfi-08.jpg","../images/gallery/amalfi/amalfi-09.jpg","../images/gallery/amalfi/amalfi-10.jpg","../images/gallery/amalfi/amalfi-11.jpg","../images/gallery/amalfi/amalfi-12.jpg","../images/gallery/amalfi/amalfi-13.jpg","../images/gallery/amalfi/amalfi-14.jpg","../images/gallery/amalfi/amalfi-15.jpg","../images/gallery/amalfi/amalfi-16.jpg","../images/gallery/amalfi/amalfi-17.jpg","../images/gallery/amalfi/amalfi-18.jpg","../images/gallery/amalfi/amalfi-19.jpg","../images/gallery/amalfi/amalfi-20.jpg","../images/gallery/amalfi/amalfi-21.jpg","../images/gallery/amalfi/amalfi-22.jpg","../images/gallery/amalfi/amalfi-23.jpg","../images/gallery/amalfi/amalfi-24.jpg","../images/gallery/amalfi/amalfi-25.jpg","../images/gallery/amalfi/amalfi-26.jpg","../images/gallery/amalfi/amalfi-27.jpg","../images/gallery/amalfi/amalfi-28.jpg","../images/gallery/amalfi/amalfi-29.jpg","../images/gallery/amalfi/amalfi-30.jpg","../images/gallery/amalfi/amalfi-31.jpg"];
  var lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCount=document.getElementById('lbCount');
  var idx=0;
  function show(i){idx=(i+imgs.length)%imgs.length;lbImg.src=imgs[idx];lbCount.textContent=(idx+1)+' / '+imgs.length;}
  function open(i){show(i);lb.classList.add('open');document.body.style.overflow='hidden';}
  function close(){lb.classList.remove('open');document.body.style.overflow='';}
  document.querySelectorAll('.thumb').forEach(function(b){b.addEventListener('click',function(){open(+b.dataset.i);});});
  document.getElementById('lbClose').addEventListener('click',close);
  document.getElementById('lbPrev').addEventListener('click',function(e){e.stopPropagation();show(idx-1);});
  document.getElementById('lbNext').addEventListener('click',function(e){e.stopPropagation();show(idx+1);});
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(idx-1);else if(e.key==='ArrowRight')show(idx+1);});
})();
</script>
